name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run offline migration dry-run sanity check
        run: |
          python3 skills/engram-to-knot-migration/scripts/migrate_engram.py \
            --from-file examples/sample-engram-export.json \
            --dry-run \
            --output /tmp/ci-sample-bundle.json
          python3 -c 'import json; d = json.load(open("/tmp/ci-sample-bundle.json")); assert d["summary"]["compiled_records"] == 5; assert d["summary"]["secrets_scrubbed"] == 1; assert d["summary"]["pans_scrubbed"] == 1'
          rm -f /tmp/ci-sample-bundle.json

      - name: Validate JSON files and enforce zero Unicode em-dashes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              if path.suffix in {".md", ".json", ".py", ".ts", ".yml", ".yaml"}:
                  text = path.read_text(encoding="utf-8")
                  if "\u2014" in text:
                      raise SystemExit(f"Forbidden Unicode em-dash found in {path}")
          print("All JSON files valid and zero em-dashes detected.")
          PY
